<style>
:root{--ink:#4a3550;--pink:#ff6f9f;--bg1:#ffe9f1;--bg2:#e6dcff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Nunito,ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;gap:8px;justify-content:center;padding:10px 12px 0}
header button{border:0;border-radius:999px;padding:9px 16px;font:800 14px inherit;font-family:inherit;color:var(--ink);background:#fff;box-shadow:0 3px 0 #e3d3f5}
header button:active{transform:translateY(2px);box-shadow:0 1px 0 #e3d3f5}
#stage{flex:1;min-height:0;display:flex;justify-content:center;padding:6px 0}
#stage svg{height:100%;max-width:100%}
#panel{background:#fff;border-radius:26px 26px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px #b79ae233;max-height:44dvh;display:flex;flex-direction:column;gap:10px}
#tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#tabs button{flex:none;border:0;border-radius:14px;padding:8px 12px;font:800 13px inherit;font-family:inherit;color:var(--ink);background:#f6effb}
#tabs button.on{background:var(--pink);color:#fff}
#sw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#sw button{flex:none;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3d3f5}
#sw button.on{box-shadow:0 0 0 3px var(--pink)}
#grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;overflow-y:auto}
#grid button{width:68px;height:78px;border:2px solid transparent;border-radius:16px;background:#fff6fb;padding:2px;font:700 11px inherit;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between}
#grid button.on{border-color:var(--pink)}
#grid svg{width:100%;height:56px}
#grid .no{font-size:24px;line-height:56px}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:#fff;border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:0 6px 20px #7a52b844;transition:transform .35s;z-index:9;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
#ov{position:fixed;inset:0;background:#4a355099;display:none;align-items:flex-end;z-index:8}
#ov.on{display:flex}
#ov .box{background:#fff;border-radius:26px 26px 0 0;width:100%;max-height:75dvh;overflow:auto;padding:18px}
#ov h2{margin:0 0 4px;font-size:20px}
.a{display:flex;gap:10px;padding:8px 0;opacity:.45}.a.ok{opacity:1}.a b{display:block}.a small{color:#8a7a95}
#sw input[type=color]{-webkit-appearance:none;appearance:none;flex:none;width:28px;height:28px;padding:0;margin:0;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #e3d3f5;background:conic-gradient(#ff6f9f,#ffd166,#7fd8c0,#6aa7ff,#b28dff,#ff6f9f);overflow:hidden}
#sw input[type=color]::-webkit-color-swatch-wrapper{padding:0}
#sw input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
#sw input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
#stage{position:relative;overflow:hidden}
#stage svg.scene{position:absolute;inset:0;width:100%;height:100%;max-width:none;z-index:0}
#stage .doll{position:relative;z-index:1;transform-origin:50% 100%;animation:bob 3.2s ease-in-out infinite}
#stage .doll.pop{animation:pop .4s ease-out,bob 3.2s .4s ease-in-out infinite}
#stage .doll.spin{animation:spin .6s ease-in-out,bob 3.2s .6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.93)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes spin{0%{transform:rotate(-12deg) scale(.88)}60%{transform:rotate(8deg) scale(1.06)}100%{transform:rotate(0) scale(1)}}
#stage .bl{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
#stage .pet{transform-box:fill-box;transform-origin:50% 100%;animation:hop 2.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px) rotate(-2deg)}}
.fl{animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-480px)}to{transform:translateY(480px)}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.dr{animation:dr 9s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
.sp{position:absolute;left:50%;top:42%;font-size:18px;pointer-events:none;z-index:3;animation:spk .8s ease-out forwards}
@keyframes spk{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
#grid button,#tabs button,#pt button{transition:transform .15s}
#grid button:active,#tabs button:active,#pt button:active{transform:scale(.92)}
#pt{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#pt button{border:0;border-radius:12px;padding:6px 10px;font:700 12px inherit;font-family:inherit;color:var(--ink);background:#f6effb}
#pt button.on{background:var(--pink);color:#fff}
@media (prefers-reduced-motion:reduce){#stage *{animation:none!important}}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
</style>
</head>

  $('pt').innerHTML=PATC.includes(tab)?PN.map((n,i)=>`<button data-p="${i}" class="${(S[tab].p||0)===i?'on':''}">${n}</button>`).join(''):'';
  if(solo){$('grid').innerHTML='';return}
  if(bg){$('grid').innerHTML=BG.map((b,i)=>`<button data-i="${i}" class="${S.bg===i?'on':''}"><span style="display:block;height:56px;border-radius:12px;background:${bgCss(i)}"></span>${i+1}</button>`).join('');return}
  const none={s:-1,c:'#ffffff'};
  let h=`<button data-i="-1" class="${S[tab].s<0?'on':''}"><span class="no">✕</span>нет</button>`;
  ITEMS[tab].forEach((it,i)=>{
    const t={skin:S.skin};Object.keys(ITEMS).forEach(c=>t[c]=none);
    t[tab]={s:i,c:S[tab].c,p:S[tab].p};
    h+=`<button data-i="${i}" class="${S[tab].s===i?'on':''}">${draw(t,VIEW[tab])}${it.n}</button>`;
  });
  $('grid').innerHTML=h;
}
function setCol(v){
  if(tab==='skin'||tab==='eyes')S[tab]=v;
  else{S[tab].c=v;if(S[tab].s<0){S[tab].s=0;seen(tab,0);S.st.n++}}
  S.rn=0;POP=1;save();bump();ui();
}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.c;ui()}};
$('sw').onclick=e=>{const b=e.target.closest('button');if(b)setCol(b.dataset.col)};
$('sw').onchange=e=>{if(e.target.id==='cp')setCol(e.target.value)};
$('grid').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;
  if(tab==='bg')S.bg=i;
  else{if(i>=0&&(tab==='top'||tab==='bottom'))S.dress.s=-1;S[tab].s=i;if(i>=0){seen(tab,i);S.st.n++}}
  S.rn=0;POP=1;save();bump();ui()};
$('pt').onclick=e=>{const b=e.target.closest('button');if(!b)return;S[tab].p=+b.dataset.p;if(S[tab].s<0){S[tab].s=0;seen(tab,0);S.st.n++}S.rn=0;POP=1;save();bump();ui()};
$('rnd').onclick=()=>{
  const k=S.skin,e=S.eyes,b=S.bg,st=S.st;S=def();Object.assign(S,{skin:k,eyes:e,bg:b,st});
  Object.keys(ITEMS).forEach(c=>{const on=!['hat','glasses','ears','tights','jacket','neck','bag','pet'].includes(c)||Math.random()<.5;S[c]={s:on?Math.floor(Math.random()*ITEMS[c].length):-1,c:pick(pal(c)),p:PATC.includes(c)&&Math.random()<.4?1+Math.floor(Math.random()*5):0}});
  S.dress.s=Math.random()<.35?Math.floor(Math.random()*ITEMS.dress.length):-1;
  S.bra.c=S.panties.c=pick(CL);S.rn=1;POP=2;
  save();ui();try{tg.HapticFeedback.impactOccurred('light')}catch(e){}
};
$('rst').onclick=()=>{const k=S.skin,e=S.eyes,b=S.bg,st=S.st;S=def();Object.assign(S,{skin:k,eyes:e,bg:b,st});POP=1;save();ui()};
$('trf').onclick=()=>{const a=S.st.a;$('ov').innerHTML=`<div class="box"><h2>Задания дня</h2>${daily().map(([n,d])=>`<div class="a ok"><span>${S.st.q.includes(DAY()+':'+n)?'✅':'⬜'}</span><div><b>${n}</b><small>${d}</small></div></div>`).join('')}<h2 style="margin-top:14px">Достижения ${a.length}/${ACH.length}</h2><small>Примерено вещей: ${S.st.t.length}/${TOTAL}</small>`+ACH.map(([n,d])=>`<div class="a ${a.includes(n)?'ok':''}"><span>${a.includes(n)?'🏆':'🔒'}</span><div><b>${n}</b><small>${d}</small></div></div>`).join('')+'</div>';$('ov').classList.add('on')};
$('ov').onclick=e=>{if(e.target.id==='ov')$('ov').classList.remove('on')};

$('snp').onclick=()=>{
  const hx=BG[S.bg].match(/#[0-9a-f]{6}/gi)||['#ffe9f1','#e6dcff'],x=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 300 480">${SCN[S.bg]?SCN[S.bg]():''}`+draw(S,null,false).replace(/^<svg[^>]*>/,'');
  const im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=600;c.height=960;const g=c.getContext('2d');
    const gr=g.createLinearGradient(0,0,600,960);gr.addColorStop(0,hx[0]);gr.addColorStop(1,hx[1]||hx[0]);g.fillStyle=gr;g.fillRect(0,0,600,960);g.drawImage(im,0,0,600,960);
    $('ov').innerHTML=`<div class="box" style="text-align:center"><h2>Твой образ</h2><img src="${c.toDataURL('image/png')}" style="max-height:55dvh;max-width:100%"><p>Нажми на картинку и удерживай, чтобы сохранить или отправить</p></div>`;$('ov').classList.add('on')};
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x);
};
ui();
load(v=>{if(v&&v.hair){S=Object.assign(def(),v);if(!S.st||S.st.v!==2)S.st=def().st;S.st.q=S.st.q||[];ui()}});
</script>
</body>
</html>
