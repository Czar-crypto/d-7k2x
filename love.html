<style>
html,body{margin:0;height:100%;background:#02030a;overflow:hidden;color:#fff;font-family:system-ui,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.t{position:fixed;left:0;right:0;text-align:center;padding:0 22px;pointer-events:none;text-shadow:0 2px 18px #ff2d78,0 0 6px #000;opacity:0;transition:opacity .8s}
.t.on{opacity:1}
#st{top:calc(7vh + env(safe-area-inset-top,0px));font:700 clamp(17px,4.6vw,28px)/1.3 system-ui}
#cap{bottom:calc(8vh + env(safe-area-inset-bottom,0px))}
#cap h1{margin:0 0 8px;font:800 clamp(24px,6.6vw,44px)/1.15 system-ui}
#cap p{margin:0;min-height:1.4em;font:600 clamp(15px,4vw,22px)/1.3 system-ui}
#hint{bottom:calc(3vh + env(safe-area-inset-bottom,0px));font:600 14px system-ui;opacity:0}
#hint.on{opacity:.65}
#tools{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity 1s}
#tools.on{opacity:1;pointer-events:auto}
#tools button{border:0;border-radius:50%;background:#ffffff26;color:#fff;font-size:20px;width:44px;height:44px;backdrop-filter:blur(6px)}
#ov{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:5;text-align:center;padding:20px}
#ov.on{display:flex}#ov img{max-width:92%;max-height:72%;border-radius:14px}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#fff;color:#4a3550;font-weight:700;border-radius:999px;padding:10px 18px;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.on{opacity:1}
</style>

      if(n<170&&wAw>.01)put(spr(txt,p.ac,Math.round(p.sz/2)*2),sm(t,p.sp,p.sp+1.2)*(.6+.4*Math.sin(t*p.f*3+p.ph))*wAw,p.sz,px,py,ss,dep);
      if(wBw>.01){
        if(n%4!==0){const r=(1.1+(1-p.k)*1.4)*ss,a=gA*wBw*dep;if(a>=.02){cx.globalAlpha=Math.min(1,a);cx.fillStyle=p.gc;cx.fillRect(px-r/2,py-r/2,r,r)}}
        else put(spr(p.cw,p.gc,12),gA*wBw,6+(1-p.k)*4,px,py,ss,dep);
      }
      if(wHw>.01)put(spr(txt,p.hc,12),.85*wHw,11,px,py,ss,dep);
    }
    if(cl&&wC>.01)put(spr(cl.tok,cl.col,cl.fs),cl.a*(.9+.1*Math.sin(t*2+p.ph))*wC,cl.sz,px,py,ss,dep);
  }
  if(wC>0){cx.globalAlpha=wC;cx.drawImage(BTM,0,H*.68,W,H*.32)}
  /* созвездие Весов */
  const ca=sm(t,15.8,17.8)*(1-sm(t,22,24.5));
  if(ca>0){
    const kk=Math.cos(-19.5*Math.PI/180)*15,raw=LIB.map(s=>[-(s[0]-15.25)*kk,-(s[1]+19.5)]),xs=raw.map(p=>p[0]),ys=raw.map(p=>p[1]),
      bw=Math.max(...xs)-Math.min(...xs),bh=Math.max(...ys)-Math.min(...ys),sc=m*.6/Math.max(bw,bh),mx=(Math.max(...xs)+Math.min(...xs))/2,my=(Math.max(...ys)+Math.min(...ys))/2,
      pts=raw.map(p=>[W/2+(p[0]-mx)*sc,H*.4+(p[1]-my)*sc]),pr=sm(t,16.4,21)*LBL.length;
    cx.globalCompositeOperation='lighter';cx.lineCap='round';cx.strokeStyle='#ffe3b0';cx.lineWidth=1.3;
    for(let i=0;i<LBL.length&&i<pr;i++){const a=pts[LBL[i][0]],b=pts[LBL[i][1]],fr=Math.min(1,pr-i);cx.globalAlpha=ca*.75;cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(a[0]+(b[0]-a[0])*fr,a[1]+(b[1]-a[1])*fr);cx.stroke()}
    for(let j=0;j<LIB.length;j++)if(SF[j]<=pr){const x=pts[j][0],y=pts[j][1],r=LIB[j][2],tw=.75+.25*Math.sin(t*3+j*1.7);cx.globalAlpha=ca*tw;cx.drawImage(GLC,x-r*3.5,y-r*3.5,r*7,r*7);cx.fillStyle='#fff';cx.fillRect(x-r/2.2,y-r/2.2,r/1.1,r/1.1)}
    cx.globalCompositeOperation='source-over';
    if(pr>LBL.length*.9){cx.globalAlpha=ca*sm(pr,LBL.length*.9,LBL.length);cx.fillStyle='#ffe9c9';cx.textAlign='center';cx.textBaseline='middle';cx.font='700 '+Math.round(Math.min(26,W*.06))+'px '+FONT;cx.fillText('♎\uFE0E  Весы',W/2,Math.min(H*.4+bh*sc/2+34,H*.86))}
  }
  /* сердечки от касаний */
  for(let i=TP.length-1;i>=0;i--){const q=TP[i];q.x+=q.vx*f;q.y+=q.vy*f;q.vy+=.05*f;q.l-=.018*f;if(q.l<=0){TP.splice(i,1);continue}const sp=spr(q.h,'#fff',14);if(sp){cx.globalAlpha=Math.min(1,q.l*1.2);cx.drawImage(sp.c,q.x-sp.w/2,q.y-sp.h/2,sp.w,sp.h)}}
  /* салют из сердец */
  if(done&&t-lastFW>1.8){lastFW=t;FW.push({x:rnd(W*.2,W*.8),y:H+10,vy:-rnd(8,11)*H/700,ty:rnd(H*.18,H*.4),c:HC[Math.random()*HC.length|0]})}
  cx.globalCompositeOperation='lighter';
  for(let i=FW.length-1;i>=0;i--){const r=FW[i];r.y+=r.vy*f;cx.globalAlpha=.8;cx.strokeStyle=r.c;cx.lineWidth=2;cx.beginPath();cx.moveTo(r.x,r.y);cx.lineTo(r.x,r.y+16);cx.stroke();
    if(r.y<=r.ty){FW.splice(i,1);const k=m/390*.16;for(let j=0;j<70;j++){const v=hv(j/70*6.2832),sc2=j%2?1:.55;FP.push({x:r.x,y:r.y,vx:v[0]*k*sc2,vy:-v[1]*k*sc2,l:1,c:j%7?r.c:'#ffffff'})}}}
  for(let i=FP.length-1;i>=0;i--){const q=FP[i];q.x+=q.vx*f;q.y+=q.vy*f;q.vx*=Math.pow(.965,f);q.vy=q.vy*Math.pow(.965,f)+.03*f;q.l-=.011*f;if(q.l<=0){FP.splice(i,1);continue}cx.globalAlpha=q.l;cx.fillStyle=q.c;cx.fillRect(q.x-1.3,q.y-1.3,2.6,2.6)}
  cx.globalCompositeOperation='source-over';
  /* вступление */
  const fa=sm(t,.4,1.4)*(1-sm(t,3.2,4.4));
  if(fa>0){cx.globalAlpha=fa;cx.fillStyle='#ffd6e8';cx.textAlign='center';cx.textBaseline='middle';cx.font='700 '+Math.min(34,W*.07)+'px '+FONT;cx.fillText(NAME+', это для тебя ❤',W/2,H/2)}
  /* подписи по этапам */
  let li=-1;for(let i=0;i<LINES.length;i++)if(t>=LINES[i][0])li=i;
  if(li!==curL){curL=li;if(li>=0)setText($('st'),LINES[li][1])}
  $('hint').classList.toggle('on',t>13&&t<TC);
  /* финал */
  if(t>TD){
    if(!done){done=true;lastFW=t-1.2;$('cap').classList.add('on');$('tools').classList.add('on');
      for(let i=0;i<90;i++)CF.push({x:rnd(0,W),y:rnd(-H,0),vy:rnd(1.2,3),ph:rnd(0,6.28),s:rnd(14,26),h:HEARTS[i%HEARTS.length]})}
    const mi=Math.floor((t-TD)/5)%MSGS.length;if(mi!==curM){curM=mi;setText($('m'),MSGS[mi])}
  }
  for(const c of CF){c.y+=c.vy*f;c.x+=Math.sin(t+c.ph)*.6*f;if(c.y>H+30)c.y=-30;const sp=spr(c.h,'#fff',Math.round(c.s/2)*2);if(sp){cx.globalAlpha=.9;cx.drawImage(sp.c,c.x-sp.w/2,c.y-sp.h/2,sp.w,sp.h)}}
  requestAnimationFrame(frame);
}
function restart(){T0=performance.now();done=false;CF=[];TP=[];FW=[];FP=[];curL=-1;curM=-1;ry=rx=vy=vx=0;$('cap').classList.remove('on');$('tools').classList.remove('on');$('st').classList.remove('on')}
$('rp').onclick=restart;
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
$('oc').onclick=()=>$('ov').classList.remove('on');
$('sv').onclick=()=>{
  const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const g=c.getContext('2d');g.drawImage(cv,0,0);
  g.textAlign='center';g.fillStyle='#fff';g.shadowColor='#ff2d78';g.shadowBlur=24;g.font='800 '+Math.round(c.width*.06)+'px '+FONT;g.fillText(TITLE+', '+NAME+'!',c.width/2,c.height*.95);
  c.toBlob(async b=>{
    const f=new File([b],'for-you.png',{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Для тебя ❤'});return}}catch(e){if(e&&e.name==='AbortError')return}
    $('oi').src=c.toDataURL('image/png');$('ov').classList.add('on');
  },'image/png');
};
$('sh').onclick=async()=>{
  try{if(navigator.share){await navigator.share({title:'Для тебя ❤',text:'Открой 💌',url:location.href});return}}catch(e){return}
  try{await navigator.clipboard.writeText(location.href);toast('Ссылка скопирована ❤')}catch(e){toast(location.href)}
};
rs();loadPhoto(()=>{build();T0=performance.now();requestAnimationFrame(frame)});
</script>
